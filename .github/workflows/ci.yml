name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      real:
        description: Also run the smoke test against the real GitHub API
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Runs only when started by hand, so forks and pull requests never see the secret.
  real:
    if: github.event_name == 'workflow_dispatch' && inputs.real
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Write the token to a file
        env:
          TOKEN: ${{ secrets.PICG_E2E_TOKEN }}
        run: |
          umask 077
          printf %s "$TOKEN" > "$RUNNER_TEMP/e2e-token"
      - run: pnpm e2e:real
        env:
          PICG_E2E_TOKEN_FILE: ${{ runner.temp }}/e2e-token
          PICG_E2E_REPO: ${{ vars.PICG_E2E_REPO }}
